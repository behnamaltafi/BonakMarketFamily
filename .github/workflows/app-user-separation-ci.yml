name: AppUser separation - build and tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/app-user-separation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_ROLL_FORWARD: Major
  MSBUILDTERMINALLOGGER: 'off'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Smartstore
        run: dotnet build Smartstore.sln --configuration Release -p:SmartstoreBuildRuntime=linux-x64 --no-self-contained
      - name: Test independent-user authorization components
        run: dotnet test test/Smartstore.Core.Tests/Smartstore.Core.Tests.csproj --configuration Release -p:SmartstoreBuildRuntime=linux-x64 --no-build --no-restore --filter "FullyQualifiedName~AppUser"
