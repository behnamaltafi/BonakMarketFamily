name: Native BonakMarket SMS OTP - build and tests

on:
  push:
    branches: [feature/native-sms-otp-login, feature/sms-gateway-provider-routing]
    paths:
      - 'src/BonakMarket.Modules/BonakMarket.MultiSms/**'
      - 'src/BonakMarket.Core/Platform/Messaging/Services/ISmsSender.cs'
      - 'test/BonakMarket.Core.Tests/**'
      - '.github/workflows/native-sms-otp-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/BonakMarket.Modules/BonakMarket.MultiSms/**'
      - 'src/BonakMarket.Core/Platform/Messaging/Services/ISmsSender.cs'
      - 'BonakMarket.sln'
      - 'test/BonakMarket.Core.Tests/**'
      - '.github/workflows/native-sms-otp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  MSBUILDTERMINALLOGGER: 'off'

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build full BonakMarket solution and SMS module
        run: dotnet build BonakMarket.sln -c Release -p:BonakMarketBuildRuntime=linux-x64 --no-self-contained
      - name: Test OTP, provider failover, mock isolation, history helpers and API
        run: dotnet test test/BonakMarket.Core.Tests/BonakMarket.Core.Tests.csproj -c Release -p:BonakMarketBuildRuntime=linux-x64 --no-build --no-restore --filter "FullyQualifiedName~SmsProviderRoutingTests|FullyQualifiedName~SmsIrProviderTests|FullyQualifiedName~SmsDiagnosticsTests|FullyQualifiedName~SmsGatewaySenderTests|FullyQualifiedName~SmsPhoneNormalizerTests|FullyQualifiedName~SmsMockAndHistoryTests|FullyQualifiedName~SmsHistoryTransportTests|FullyQualifiedName~SmsApiControllerTests|FullyQualifiedName~SmsLoginWidgetSourceTests|FullyQualifiedName~SmsPrimaryLoginFilterTests"
